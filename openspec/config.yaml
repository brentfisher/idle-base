schema: spec-driven

context: |
  Domain: idle-base is a baseball-themed idle/incremental browser game. Client-only —
  no backend of our own, no accounts, nothing hosted or operated by us. State lives in
  React Context + useReducer; persistence is localStorage.

  ONE EXCEPTION, added by the achievements/leaderboard work and bounded on purpose:
  src/persistence/leaderboardClient.js makes optional outbound calls to a third-party
  leaderboard API (Talo's managed free tier) so players can post finished runs to a
  shared board. It is the ONLY networked code in the repo. Rules that keep it bounded:
    - Nothing in src/engine/ may touch the network; `fetch` is a DOM API and engine/ is
      pure. The client lives in persistence/, beside saveLoad.js.
    - advance() never calls it. A tick that made a request would make hundreds during an
      offline catch-up.
    - Every failure is a no-op: the game is fully playable offline, nothing awaits a
      response, and no throw escapes the client.
    - Still no runtime dependency (plain fetch) and still no accounts.
  Hosting anything remains out of scope — no server, no database, no serverless function,
  no proxy. See docs/PRD-achievements-and-leaderboard.md §3.1 and §8.

  A SECOND third-party contact, added by the launch visualization and bounded the same way:
  src/components/expedition/LaunchScene.js fetches three.js from a CDN at runtime, at a
  PINNED version with an SRI integrity hash and crossorigin="anonymous", and only when Act
  VII's Launch panel is opened on a device that can render it. It is NOT in package.json —
  React remains the only runtime dependency and dist/bundle.js does not carry it. Rules:
    - If the fetch fails, is blocked, or fails its integrity check, the scene does not
      render and the panel is complete without it. Absence is a designed state.
    - Nothing the player needs may live only inside the scene.
    - Never a floating version tag. A mutable URL makes the next release of a third-party
      library into arbitrary code in a player's browser, chosen by someone else.
  Bundling it instead was measured at +723KB as this repo is configured, or +127KB with
  babel `modules: false`. Worth knowing for the NEXT dependency: `modules: 'commonjs'` in
  babel.config.js means Babel rewrites ESM before webpack sees it, so webpack tree-shaking
  and code-splitting are both disabled repo-wide. Nothing is lost today (the app's own code
  is hand-written CommonJS) but every bundled dependency pays that penalty.

  Tech stack: React 18 (the only runtime dependency), Webpack 5, Babel. No TypeScript,
  no routing library, no state-management library, no UI kit.

  IMPORTANT — CommonJS, not ES modules. Every file uses require() and module.exports,
  including React imports (`const React = require('react')`), despite Babel being
  configured for ESM. Do not introduce import/export syntax; it breaks the established
  pattern throughout the codebase.

  Style: plain `function foo() {}` declarations rather than arrow-assigned consts
  (except short inline callbacks). Single quotes, semicolons, 2-space indent. No
  PropTypes and no runtime prop validation.

  Layering is strict and load-bearing:
    - src/engine/  — pure simulation. Must NOT import React or DOM APIs. Highly testable.
    - src/state/   — reducer + per-domain action modules, all pure (state, action) => newState.
    - src/components/ — the only layer importing React or dispatching actions.
    - src/data/    — static config/tuning tables with no logic.
  New simulation logic belongs in engine/, never inlined into a reducer action or a
  component. Magic numbers belong in src/data/, not in engine/ or state/.

  State updates are immutable spreads. No mutation, no Immer or similar.

  Single simulation entry point: engine/tickEngine.js `advance(state, deltaSeconds)` is
  called identically by the live 1s tick and by engine/offlineProgress.js's load-time
  catch-up. Any time-driven mechanic MUST fold into that function — a separate timer
  will silently fail to apply during offline catch-up. Always verify changes against the
  offline path, not just the live tick.

  Testing: there is NO test framework, linter, or CI in this repo — package.json has only
  `start` and `build`. Verify by running the app (npm start) and by diff review. Do not
  add a test framework as a side effect of unrelated work; propose it as its own change.

  Comments explain non-obvious invariants and hidden constraints, not what the code says.
  See engine/tickEngine.js, engine/offlineProgress.js and state/initialState.js for the
  house style.

  Saves: persistence/saveLoad.js DISCARDS any save whose meta.version mismatches — there
  is no migration path. Bumping the version is a breaking change for existing players.

  Hard invariant (see changes/odyssey-progression-architecture/design.md, Decision 6):
  no mechanic may reduce a currency below zero, and no mechanic may remove the manual
  click/Hustle income action. This is the structural guarantee that no sequence of
  gambling losses can leave a save unrecoverable.

  Planning docs: docs/PRD-incremental-odyssey.md is the product spec for the in-progress
  restructure of the game into a six-act progression.

