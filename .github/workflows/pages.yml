# Builds the game and publishes it to GitHub Pages.
#
# The build output is NOT committed — `dist/` stays in .gitignore and this workflow
# produces it fresh, so what is served is always what the source on this branch
# builds. `output.publicPath` is unset in webpack.config.js, which defaults to
# 'auto' and emits a relative `<script src="bundle.js">`, so the bundle resolves
# correctly under the /<repo>/ subpath Pages serves from.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets a deploy be run by hand from any branch — useful for previewing a story
  # branch before it merges. The github-pages environment may restrict which
  # branches are allowed to deploy; see the repository's environment settings.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are allowed to finish rather than
# being cancelled, so a half-uploaded artifact is never what gets published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci` needs a lockfile in sync with package.json; this repo has one.
      - run: npm ci

      # The leaderboard's access key, inlined into the bundle by webpack's DefinePlugin.
      #
      # IT IS NOT A SECRET AND CANNOT BE ONE — it ships inside a JavaScript bundle every visitor
      # downloads, and docs/PRD-achievements-and-leaderboard.md §3.1 accepts that outright: the
      # board is a shared wall, not a verified ranking. It lives in repository settings rather than
      # in this file for two ordinary reasons instead: rotating it is a settings change and a
      # re-run rather than a commit, and a fork gets no key and therefore posts nothing into this
      # game's board.
      #
      # Stored as a SECRET rather than a variable only because Actions masks secrets in logs. A
      # repository variable (`vars.`) would be the more honest label; swap the expression if you
      # would rather it read that way.
      #
      # ABSENT IS SAFE. With no value, persistence/leaderboardClient.js reports itself
      # unconfigured, the Records tab says the board is not set up, the post prompt never appears,
      # and every other part of the game is untouched.
      - run: npm run build
        env:
          LEADERBOARD_ACCESS_KEY: ${{ secrets.LEADERBOARD_ACCESS_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
